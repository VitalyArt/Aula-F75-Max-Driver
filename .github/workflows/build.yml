name: Build

on:
  push:
    branches:
      - "**"
      - "!sparkle-feeds"
    tags:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  macos-dmg:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    name: macOS DMG
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve build version
        run: python3 scripts/release/build-version.py

      - name: Test release feed generation
        run: make packaging-test

      - name: Test macOS and portable Swift code
        run: make macos-test

      - name: Build macOS DMG
        run: make macos-dmg

      - name: Sign macOS update feed
        if: startsWith(github.ref, 'refs/tags/')
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: make macos-appcast

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: aula-f75-max-driver-macos-dmg
          path: |
            build/Aula F75 Max Driver.dmg
            build/macos.appcast.xml
          if-no-files-found: error

  linux-build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    name: Linux GTK
    runs-on: ubuntu-latest
    container:
      image: swift:6.0-noble

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          apt-get update
          apt-get install -y build-essential make libgtk-4-dev libhidapi-dev pkg-config python3-pil xvfb xauth ffmpeg

      - name: Resolve build version
        run: python3 scripts/release/build-version.py

      - name: Test Linux code and interface
        run: make linux-test

      - name: Build Linux DEB installer
        run: make linux-deb LINUX_DEB="build/app.deb"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: aula-f75-max-driver-linux
          path: build/app.deb
          if-no-files-found: error

  android-build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    name: Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve build version
        run: python3 scripts/release/build-version.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0

      - name: Test Android app
        run: make android-test

      - name: Build Android debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: make android-build

      - name: Upload Android debug artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: aula-f75-max-driver-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build Android release APK
        if: startsWith(github.ref, 'refs/tags/')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: make android-release

      - name: Upload Android release artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: aula-f75-max-driver-android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - macos-dmg
      - linux-build
      - android-build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve build version
        run: python3 scripts/release/build-version.py

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: aula-f75-max-driver-macos-dmg
          path: release

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: aula-f75-max-driver-linux
          path: release

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: aula-f75-max-driver-android-apk
          path: release

      - name: Publish release installers and signed feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: make release-publish RELEASE_DIR=release RELEASE_TAG="$GITHUB_REF_NAME"

  publish-update-pages:
    if: startsWith(github.ref, 'refs/tags/')
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
