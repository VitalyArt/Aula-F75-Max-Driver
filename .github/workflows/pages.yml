name: Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag whose signed appcast must be publicly available
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        run: make site-build

      - name: Include signed update feeds
        run: bash scripts/release/copy-update-feeds.sh build/site

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published appcasts
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python3 scripts/release/verify-pages.py build/site "$PAGES_URL" --tag "$RELEASE_TAG"
